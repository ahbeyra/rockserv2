services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rockserv_root}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - ./r2_schema_data.pg.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  rockserv2:
    environment:
      ROCKSERV_DB_DRIVER: Pg
      ROCKSERV_DB_HOST: db
      ROCKSERV_DB_PORT: 5432
      ROCKSERV_DB_USER: ${ROCKSERV_DB_USER:-rockserv}
      ROCKSERV_DB_PASS: ${ROCKSERV_DB_PASS:-change_me}

volumes:
  pg_data:
